services:
  - type: web
    name: scam-checker
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/usage
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.18
      - key: GEMINI_API_KEY
        sync: false
      - key: TEXT_MODEL
        value: gemini-3.5-flash-lite
      - key: IMAGE_MODEL
        value: gemini-3-pro-image
      - key: IMAGE_SIZE
        value: 2K
      - key: MONTHLY_CAP_INR
        value: "2500"